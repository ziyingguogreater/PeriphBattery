name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"          # 让 Python 用 UTF-8 输出，避免中文打印报错
      PYTHONIOENCODING: "utf-8"
    steps:
      # v5 起改用 Node 24 运行时
      - uses: actions/checkout@v5

      # v6 起改用 Node 24 运行时
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包 exe
        run: pyinstaller --noconfirm PeriphBattery.spec

      - name: 组装便携包
        run: python package.py PeriphBattery-portable.zip

      # 用 runner 自带的 gh 发版，不依赖第三方 action，也就没有 Node 20/24 的兼容问题
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="dist/PeriphBattery-portable.zip"
          if [ ! -f "$PKG" ]; then
            echo "打包产物不存在：$PKG"
            ls -R dist
            exit 1
          fi
          {
            echo "便携包解压即用，无需安装。"
            echo
            echo "> 本项目由 AI 制作，使用前请自行审阅代码。"
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，仅更新附件"
            gh release upload "$TAG" "$PKG" --clobber
          else
            gh release create "$TAG" "$PKG" --title "$TAG" --notes-file release-notes.md
          fi
