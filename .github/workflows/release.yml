name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"          # 让 Python 用 UTF-8 输出，避免中文打印报错
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包 exe
        run: pyinstaller --noconfirm PeriphBattery.spec

      - name: 组装便携包
        run: python package.py PeriphBattery-portable.zip

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}   # 明确绑定当前标签，避免挂到别的 Release
          files: dist/PeriphBattery-portable.zip   # package.py 输出在 dist 下
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            便携包解压即用，无需安装。

            > 本项目由 AI 制作，使用前请自行审阅代码。
